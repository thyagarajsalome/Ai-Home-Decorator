[build]
  base = "ai-home-next"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_RAZORPAY_KEY_ID"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"
